<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>
    <nav>
        <ul>
            <li><a href="tabella.html">Informazioni film</a></li>
        </ul>
    </nav>
    <div class="contact-container">
        <div class="titolo">
            <h2>Inserisci informazioni sul film</h2>
        </div>
        <div class="form-group">
            <p>Nome del film</p>
            <input type="text" id="inputNome" placeholder="Titolo del film">
            <p>Durata del film(minuti)</p>
            <input type="text" id="inputDurata" placeholder="Durata del film">
            <p>Data in cui è stato visto</p>
            <input type="date" id="inputData" placeholder="Data in cui è stato visto">
            <p>È stato visto al cinema?</p>
            <input type="checkbox" id="inputCinema">
            <br><br>
            <button id="btnInvia">Invia dati</button>
        </div>
    </div>
    
    <script src="script.js"></script>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
