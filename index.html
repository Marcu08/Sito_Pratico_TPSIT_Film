<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1>Prova</h1>
    <nav>
        <ul>
            <li><a href="tabella.html">Informazioni film</a></li>
        </ul>
    </nav>
    <div>
        <p>Nome del film</p>
        <input type="text" id="inputNome">
        <p>Durata del film</p>
        <input type="number" id="inputDurata">
        <p>Data in cui è stato visto</p>
        <input type="date" id="inputData">
        <p>È stato visto al cinema?</p>
        <input type="checkbox" id="inputCinema">
        <br><br>
        <button id="btnInvia" type="button">Invia dati</button>
    </div>

    <div class="actions mt-4">
        <button id="btnWatchTime" type="button">Calcola tempo totale</button>
        <button id="btnFrequenzaCinema" type="button">Calcola frequenza cinema</button>
    </div>

    <div class="modal fade" id="modalWatchTime" tabindex="-1" aria-labelledby="modalWatchTimeLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modalWatchTimeLabel">Tempo totale</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
                </div>
                <div class="modal-body" id="modalWatchTimeBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalCinema" tabindex="-1" aria-labelledby="modalCinemaLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modalCinemaLabel">Frequenza cinema</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
                </div>
                <div class="modal-body" id="modalCinemaBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
