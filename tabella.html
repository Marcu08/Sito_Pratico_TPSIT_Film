<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabella</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5 pt-5">
        <h1 class="text-center mb-4">Informazioni sui film</h1>
        <p id="NumeroFilm" class="fw-bold"></p>

        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Durata</th>
                        <th>Data</th>
                        <th>Cinema</th>
                        <th>Azioni</th>
                    </tr>
                </thead>
                <tbody id="corpoTabella"></tbody>
            </table>
        </div>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
        </ul>
    </nav>
<div class="container my-4">
    <div class="row g-2 justify-content-center">
        <div class="col-6 col-md">
            <button class="btn btn-primary w-100" id="btnWatchTime">WATCH TIME</button>
        </div>
        <div class="col-6 col-md">
            <button class="btn btn-warning w-100" id="btnFrequenzaCinema">FREQUENZA CINEMA</button>
        </div>
        <div class="col-6 col-md">
            <button class="btn btn-danger w-100" id="btnEliminazioneTutti">ELIMINA TUTTI</button>
        </div>
        <div class="col-6 col-md">
            <button class="btn btn-success w-100" id="btnSalvataggioInformazioni">Salva</button>
        </div>
        <div class="col-6 col-md">
            <button class="btn btn-info w-100" id="btnCaricamentoInformazioni">Carica</button>
        </div>
        <div class="col-6 col-md">
            <button class="btn btn-secondary w-100" id="btnGemini">Consigli AI 🤖</button>
        </div>
    </div>
</div>
    <div id="risultato"></div>
    <!-- Modal Watch Time -->
<div class="modal fade" id="modalWatchTime" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Watch Time</h5></div>
      <div class="modal-body" id="modalWatchTimeBody"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Cinema -->
<div class="modal fade" id="modalCinema" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Frequenza Cinema</h5></div>
      <div class="modal-body" id="modalCinemaBody"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
      </div>
    </div>
  </div>
</div>
    <script src="script.js"></script>

</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
