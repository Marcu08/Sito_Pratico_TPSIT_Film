<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabella</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5 pt-5">
        <h1 class="text-center mb-4">Informazioni sui film</h1>
        <p id="NumeroFilm" class="fw-bold"></p>

        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Durata</th>
                        <th>Data</th>
                        <th>Cinema</th>
                        <th>Azioni</th>
                    </tr>
                </thead>
                <tbody id="corpoTabella"></tbody>
            </table>
        </div>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
        </ul>
    </nav>
    //tabella in futuro react
    <button class="btn btn-primary" id="btnWatchTime">WATCH TIME</button>
    <button class="btn btn-warning" id="btnFrequenzaCinema">FREQUENZA CINEMA</button>
    <button class="btn btn-danger" id="btnEliminazioneTutti">ELIMINA TUTTI I FILM</button>
    <button class="btn btn-success" id="btnSalvataggioInformazioni">Salva Informazioni</button>
    <button class="btn btn-info" id="btnCaricamentoInformazioni">Carica Informazioni</button>
    <div id="risultato"></div>

    <script src="script.js"></script>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
